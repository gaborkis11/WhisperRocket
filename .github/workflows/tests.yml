# Runs on every push and pull request. Deliberately lightweight: the test suite
# is standard-library only, so CI needs no GPU, no model and no Qt - it proves
# the security-critical endpoint and the translation parity in under a minute.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check every Python file
        run: python -m compileall -q $(git ls-files '*.py')

      - name: Phone endpoint (security-critical, 73 checks)
        run: python tests/test_phone_endpoint.py

      - name: Import guarantee of the network-facing module
        run: python tests/test_stdlib_guarantee.py

      - name: Translation parity (EN/HU)
        run: python tests/test_translations.py

      - name: Translation keys used in code all exist
        run: python tests/test_translation_keys_used.py

      - name: Installer distro detection (install_lib.sh)
        run: python tests/test_install_lib.py

      - name: Environment health checks (system_check.py)
        run: python tests/test_system_check.py

      - name: Dictionary hotwords
        run: python tests/test_dictionary_hotwords.py

      - name: AI cleanup prompt rules
        run: python tests/test_ai_prompt_rules.py

      - name: Hyprland autostart block management
        run: python tests/test_hypr_autostart.py

      - name: Setup wizard UI smoke (self-skips without PySide6)
        run: python tests/test_setup_wizard_ui.py

      - name: Update checker (release check, notes, replace)
        run: python tests/test_update_checker.py

      - name: Bilingual changelog guard (updates.json)
        run: python tests/test_updates_json.py

      - name: Update dialog UI smoke (self-skips without PySide6)
        run: python tests/test_update_dialog_ui.py

      - name: About window update UI smoke (self-skips without PySide6)
        run: python tests/test_about_update_ui.py

      - name: Settings window UI smoke (self-skips without PySide6)
        run: python tests/test_settings_ui.py

      - name: Non-interactive uninstall (sandboxed)
        run: python tests/test_uninstall_auto.py

      - name: Uninstall dialog UI smoke (self-skips without PySide6)
        run: python tests/test_uninstall_dialog_ui.py
